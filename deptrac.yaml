deptrac:
  paths:
    - ./src/
  exclude_files:
    - .*test.*
  layers:
    - name: Infrastructure
      collectors:
        - type: classLike
          value: .*\\Infrastructure\\.*
    - name: Application
      collectors:
        - type: classLike
          value: .*\\Application\\.*
    - name: Domain
      collectors:
        - type: classLike
          value: .*\\Domain\\.*
    - name: Configuration
      collectors:
        - type: classLike
          value: ^Thinktomorrow\\Trader\\TraderConfig$
    - name: DomainVendor
      collectors:
        - type: composer
          composerPath: composer.json
          composerLockPath: composer.lock
          packages:
            - moneyphp/money
            - beberlei/assert
            - psr/container
    - name: Framework
      collectors:
        - type: composer
          composerPath: composer.json
          composerLockPath: composer.lock
          packages:
            - laravel/framework
            - nesbot/carbon
            - symfony/http-kernel
    - name: Vine
      collectors:
        - type: composer
          composerPath: composer.json
          composerLockPath: composer.lock
          packages:
            - thinktomorrow/vine
    - name: InfrastructureVendor
      collectors:
        - type: composer
          composerPath: composer.json
          composerLockPath: composer.lock
          packages:
            - ramsey/uuid

  ruleset:
    Infrastructure:
      - Application
      - Domain
      - Configuration
      - DomainVendor
      - Framework
      - Vine
      - InfrastructureVendor
    Application:
      - Domain
      - Configuration
      - DomainVendor
      - Framework
      - Vine
    Domain:
      - DomainVendor
    Configuration:
      - Domain
    DomainVendor: ~
    Framework: ~
    Vine: ~
    InfrastructureVendor: ~
